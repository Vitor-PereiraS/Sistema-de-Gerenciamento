<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
	<title>Lista de Documentos</title>
</h:head>

<h:body>
	<p:messages id="mensagensGlobais" autoUpdate="true" closable="true"
		showDetail="true" />
	<h:form id="formPrincipal">


		<h:panelGrid cellpadding="5" style="margin-bottom:10px;">

			<p:outputPanel>
				<p:selectOneMenu label="Vendedores"
					value="#{documento.vendedorSelecionado}">

					<f:selectItem itemLabel="Vendedores" itemValue="#{null}"
						noSelectionOption="true" />

					<f:selectItems value="#{seller.listaVendedors}" var="vend"
						itemLabel="#{vend.name}" itemValue="#{vend.id}" />


					<p:ajax event="change" update=":formPrincipal:painelfiltrar" />

				</p:selectOneMenu>
			</p:outputPanel>

			<p:outputPanel id="painelfiltrar">
				<p:commandButton value="filtrar" action="#{documento.filtrar()}"
					disabled="#{documento.vendedorSelecionado == null}"
					update="formPrincipal" icon="pi pi-check" />

				<p:commandButton value="Adicionar Documento"
					action="#{documento.pegarDocumentoSelecionadoPeloVendedor}"
					update=":formInserir"
					disabled="#{documento.vendedorSelecionado == null}"
					oncomplete="PF('dialogNovoDep').show();" />
			</p:outputPanel>

			<p:outputPanel>
				<!-- Mantemos apenas o botão de limpar para resetar a busca rapidamente -->
				<p:commandButton value="Limpar Filtros"
					action="#{documento.limparFiltro}" update="formPrincipal"
					icon="ui-icon-close" />
			</p:outputPanel>
		</h:panelGrid>



		<p:dataTable id="tabelaDocs"
			value="#{documento.listaDocumentosFiltrados}" var="doc"
			paginator="true" rows="10" selectionMode="single"
			emptyMessage="Nenhum documento cadastrado."
			paginatorPosition="bottom" sortMode="multiple"
			selection="#{documento.documentoSelecionado}" rowKey="#{doc.id}"
			unselectable="true">


			<!-- Eventos AJAX que notificam o servidor e re-renderizam o botão externo imediatamente -->
			<p:ajax event="rowSelect"
				listener="#{documento.habilitarLinhaSelecionada}"
				update=":formPrincipal:painelBotao" />

			<p:ajax event="rowUnselect"
				listener="#{documento.desabilitarLinhaSelecionada}"
				update=":formPrincipal:painelBotao" />



			<p:column headerText="ID" sortBy="#{doc.id}">
				<h:outputText value="#{doc.id}" />
			</p:column>

			<p:column headerText="Nome do Vendedor" sortBy="#{doc.vendedor.name}">
				<h:outputText value="#{doc.vendedor.name}" />
			</p:column>

			<p:column headerText="Nome do Arquivo" sortBy="#{doc.nomeArquivo}">
				<h:outputText value="#{doc.nomeArquivo}" />
			</p:column>


			<!-- NOVA COLUNA COM AS AÇÕES -->
			<p:column headerText="Ações"
				style="width: 120px; text-align: center;">

				<!-- BOTÃO EXCLUIR (Remove do banco e atualiza a tabela na hora) -->
				<p:commandButton icon="ui-icon-trash" title="Excluir"
					action="#{documento.deletar(doc.id)}"
					update=":formPrincipal:tabelaDocs" process="@this">
					<!-- Confirmação nativa simples para evitar exclusão por acidente -->
					<p:confirm header="Confirmação"
						message="Deseja realmente excluir o documento? #{dep.name}"
						icon="ui-icon-alert" />
				</p:commandButton>
			</p:column>
		</p:dataTable>
		<!-- Componente obrigatório para fazer o p:confirm funcionar -->
		<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
			<p:commandButton value="Sim" type="button"
				styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
			<p:commandButton value="Não" type="button"
				styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
		</p:confirmDialog>

		<p:outputPanel id="painelBotao" layout="block">

			<p:commandButton value="Adicionar Documento"
				action="#{documento.pegarDocumentoSelecionado}"
				update=":formInserir"
				disabled="#{documento.documentoSelecionado == null}"
				oncomplete="PF('dialogNovoDep').show();" />


			<p:commandButton id="btnDeletar" value="Deletar Selecionado"
				icon="ui-icon-trash" action="#{documento.deletarSelecionado()}"
				disabled="#{documento.documentoSelecionado == null}"
				update=":formPrincipal:tabelaDocs">
				<p:confirm header="Confirmação"
					message="Deseja realmente excluir o departamento? #{dep.name}"
					icon="ui-icon-alert" />
			</p:commandButton>
		</p:outputPanel>

	</h:form>

	<br />

	<p:button outcome="lista-vendedores.xhtml"
		value="Ir para a Lista de vendedores" icon="pi pi-check" />

	<p:button outcome="lista-departamentos.xhtml"
		value="Ir para a Lista de departamentos" icon="pi pi-check" />

	<!-- 2. JANELA FLUTUANTE (INSERÇÃO) -->
	<!-- Fica fora do formPrincipal, isolada no final do arquivo -->
	<p:dialog header="Documento #{documento.documento.vendedor.name}"
		widgetVar="dialogNovoDep" modal="true" resizable="false"
		closeOnEscape="true">
		<!-- Form exclusivo para os campos do novo departamento -->
		<h:form id="formInserir" enctype="multipart/form-data">


			<!-- ESSA LINHA É O SEGREDO: Garante que o ID do documento editado se mantenha vivo na submissão -->
			<h:inputHidden value="#{documento.documento.id}" />


			<p:messages id="msgDialog" autoUpdate="true" />

			<h:panelGrid columns="2" cellpadding="5">

				<h:outputLabel value="Nome do vendedor: " />
				<h:outputText value="#{documento.documento.vendedor.name}" />

				<h:outputLabel value="Enviar Arquivo:" />
				<!-- CORREÇÃO 2: Listener sem "()" e modo simple/advanced ajustado para o fluxo -->
				<p:fileUpload fileUploadListener="#{documento.pegarFileUpload}"
					mode="advanced" auto="true" update="msgDialog" sizeLimit="10000000"
					allowTypes="/(\.|\/)(pdf|doc|docx|png|jpg|txt)$/"
					label="Escolher Arquivo" />
			</h:panelGrid>

			<br />

			<!-- O SEGREDO ESTÁ AQUI: O update aponta lá para o formPrincipal 
			oncomplete="if (!args.validationFailed) PF('dialogNovoDep').hide();"
			-->
			<p:commandButton value="Salvar" action="#{documento.salvar}"
				update=":formPrincipal:tabelaDocs :formPrincipal:painelBotao"
				icon="ui-icon-disk"
				oncomplete="if (!args.validationFailed) PF('dialogNovoDep').hide();" />
			<p:commandButton value="Limpar" type="reset" icon="ui-icon-refresh"
				style="margin-left: 10px;" />

		</h:form>

	</p:dialog>

</h:body>

</html>
